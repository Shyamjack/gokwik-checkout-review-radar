name: Daily Shopify review tracker

on:
  schedule:
    - cron: '17 2 * * *' # 07:47 IST; GitHub Actions schedules can be delayed.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect, deduplicate, tag, and rebuild
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape && npm run build
      - name: Upload failed Shopify page evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-shopify-page-evidence
          path: artifacts/failed-pages/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "review-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "data: daily review refresh"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload refreshed dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy refreshed dashboard
        uses: actions/deploy-pages@v4
      - name: Alert only for a failed or empty run
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Review tracker alert: run ${context.runId} failed or returned no reviews`;
            const body = [
              'The scheduled review tracker needs attention.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'This issue is created only when collection/build fails, including the explicit empty-result guard.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['tracker-alert']});
      - name: Send failure webhook when configured
        if: failure()
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No ALERT_WEBHOOK_URL configured; GitHub Issue remains the alert channel."
            exit 0
          fi
          payload=$(jq -nc --arg text "Review Radar alert: the daily Shopify review scan failed or returned zero reviews. Investigate: $RUN_URL" --arg run_url "$RUN_URL" '{text: $text, status: "failed", run_url: $run_url}')
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$ALERT_WEBHOOK_URL"
