name: Alert proof (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE_ALERT_PROOF to create one demonstration issue'
        required: true
        type: string

permissions:
  issues: write

jobs:
  create-proof:
    if: inputs.confirm == 'CREATE_ALERT_PROOF'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Review tracker alert proof: simulated empty collection',
              body: `Deliberate one-time proof for the GoKwik assignment.\n\nA production scheduled run opens an equivalent issue only when its scraper/build fails, including the explicit zero-review guard.\n\nProof workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['tracker-alert', 'proof']
            });
